<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device=device,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>XionLive</title>
  <meta name="theme-color" content="#0a0a0c">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/hls.min.js"></script>
  <script src="js/match-parser.js"></script>
  <script src="js/xion-resolver.js"></script>
  <script src="js/logos.js"></script>
  <script>window.__onGCastApiAvailable=function(available){if(available){console.log('[xion] Cast API available')}}</script>
  <script src="https://www.gstatic.com/cv2/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>

  <!-- FULL SCREEN PLAYER -->
  <div class="tv-layout" id="tv-layout">
    <div class="tv-player" id="tv-player">
      <video id="video" playsinline webkit-playsinline></video>
      <div class="tv-player-empty" id="player-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="80" height="80"><path d="M8 5v14l11-7z"/></svg>
        <p>Select a match to start watching</p>
      </div>
      <div class="tv-player-loading" id="player-loading" style="display:none">
        <div class="spinner"></div>
        <p>Resolving stream...</p>
      </div>
    </div>

    <div class="tv-player-bar" id="player-bar" style="display:none">
      <div class="live-dot"></div>
      <span class="stream-info" id="stream-info">Live</span>
      <div class="tv-player-controls">
        <button id="cast-btn" title="Cast" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22"><path d="M2 16.1A5 5 0 015.9 20M2 12.05A9 9 0 019.95 20M2 8V6a2 2 0 012-2h16a2 2 0 012 2v12a2 2 0 01-2 2h-6"/><circle cx="2" cy="20" r="1" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- MATCH SIDEBAR (always visible on left) -->
  <div class="tv-sidebar" id="tv-sidebar">
    <div class="tv-sidebar-header">
      <div class="tv-sidebar-brand">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="var(--accent)"/></svg>
        <span>XIONLIVE</span>
      </div>

      <div class="tv-sidebar-tabs">
        <button class="tv-tab active" data-tab="live" id="tab-live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M16.24 7.76a6 6 0 010 8.49m-8.48-.01a6 6 0 010-8.49m11.31-2.82a10 10 0 010 14.14m-14.14 0a10 10 0 010-14.14"/></svg>
          Live
        </button>
        <button class="tv-tab" data-tab="scheduled" id="tab-scheduled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Upcoming
        </button>
        <button class="tv-tab" data-tab="history" id="tab-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
          History
        </button>
      </div>
    </div>
    <div class="tv-sidebar-content" id="match-list">
      <div class="tv-sidebar-empty">
        <div class="spinner"></div>
        <p>Loading live matches...</p>
      </div>
    </div>
  </div>

  <!-- MATCH DETAIL MODAL -->
  <div class="tv-modal-overlay" id="match-modal" style="display:none">
    <div class="tv-modal">
      <button class="tv-modal-close" id="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="tv-modal-league" id="modal-league"></div>
      <div class="tv-modal-teams">
        <div class="tv-modal-team">
          <img id="modal-home-logo" class="tv-modal-logo" src="" onerror="this.style.display='none'">
          <span class="tv-modal-team-name" id="modal-home"></span>
        </div>
        <div class="tv-modal-vs" id="modal-status">vs</div>
        <div class="tv-modal-team">
          <img id="modal-away-logo" class="tv-modal-logo" src="" onerror="this.style.display='none'">
          <span class="tv-modal-team-name" id="modal-away"></span>
        </div>
      </div>
      <div class="tv-modal-sport" id="modal-sport"></div>
      <button class="tv-modal-watch" id="modal-watch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M8 5v14l11-7z"/></svg>
        Watch Live
      </button>
    </div>
  </div>

  <!-- STREAM PICKER MODAL -->
  <div class="tv-modal-overlay" id="stream-picker" style="display:none">
    <div class="tv-modal">
      <button class="tv-modal-close" onclick="closeStreamPicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="tv-modal-title">Choose stream</div>
      <div class="tv-modal-list" id="stream-picker-list"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="tv-toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
