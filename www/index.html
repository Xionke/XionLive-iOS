<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>XionLive</title>
  <style>
    body{margin:0;background:#0a0a0c;color:#e8e8ec;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
    .loading{font-size:1.1rem;opacity:0.7}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#6c5ce7;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <div class="loading">Loading XionLive...</div>
  </div>
</body>
</html>
