<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>XionLive</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XionLive">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="stylesheet" href="css/app.css">
  <script src="hls.min.js"></script>
  <script src="js/match-parser.js"></script>
  <script src="js/xion-resolver.js"></script>
  <script src="js/logos.js"></script>
  <script>window.__onGCastApiAvailable=function(available){if(available){console.log('[xion] Cast API available')}}</script>
  <script src="https://www.gstatic.com/cv2/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="topbar-title">XIONLIVE</div>
        <div class="topbar-subtitle">FOOTBALL - LIVE SCORES - MORE</div>
      </div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-input" type="text" placeholder="Search matches, leagues, teams..." autocomplete="off">
    </div>
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-sport="all">All</button>
      <button class="tab-btn" data-sport="football">Football</button>
      <button class="tab-btn" data-sport="basketball">Basketball</button>
      <button class="tab-btn" data-sport="tennis">Tennis</button>
      <button class="tab-btn" data-sport="hockey">Hockey</button>
      <button class="tab-btn" data-sport="baseball">Baseball</button>
      <button class="tab-btn" data-sport="cricket">Cricket</button>
      <button class="tab-btn" data-sport="american-football">NFL</button>
      <button class="tab-btn" data-sport="volleyball">Volleyball</button>
      <button class="tab-btn" data-sport="others">Others</button>
    </div>
  </div>

  <!-- SCORE TICKER -->
  <div class="score-ticker" id="score-ticker"></div>

  <!-- PULL TO REFRESH -->
  <div class="pull-indicator" id="pull-indicator">
    <div class="spinner"></div>
    <span>Pull to refresh</span>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div id="match-content">
      <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <p>Loading live matches...</p>
      </div>
    </div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="player-view" id="player-view">
    <div class="player-header" id="player-header">
      <button class="player-back" id="player-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="player-title" id="player-title">XionLive</span>
      <div class="player-controls-top">
        <button id="sleep-btn" title="Sleep Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="audio-btn" title="Audio Only">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </button>
        <button id="airplay-btn" title="AirPlay" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><path d="M5 17H4a2 2 0 01-2-2V5a2 2 0 012-2h16a2 2 0 012 2v10a2 2 0 01-2 2h-1"/><polygon points="12 15 17 21 7 21 12 15"/></svg>
        </button>
        <button id="cast-btn" title="Cast" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><path d="M2 16.1A5 5 0 015.9 20M2 12.05A9 9 0 019.95 20M2 8V6a2 2 0 012-2h16a2 2 0 012 2v12a2 2 0 01-2 2h-6"/><circle cx="2" cy="20" r="1" fill="currentColor"/></svg>
        </button>
        <button id="fullscreen-btn" title="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
        </button>
      </div>
    </div>
    <div class="player-video">
      <video id="video" playsinline webkit-playsinline></video>
    </div>
    <div class="player-bottom" id="player-bottom">
      <div class="player-live-dot"></div>
      <span class="player-stream-name" id="player-stream-name">Live</span>
    </div>
    <div class="player-loading" id="player-loading">
      <div class="spinner"></div>
      <p>Resolving stream...</p>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottomnav" id="bottomnav">
    <button class="active" data-view="home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button data-view="live">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M16.24 7.76a6 6 0 010 8.49m-8.48-.01a6 6 0 010-8.49m11.31-2.82a10 10 0 010 14.14m-14.14 0a10 10 0 010-14.14"/></svg>
      <span>Live</span>
    </button>
    <button data-view="scheduled">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Scheduled</span>
    </button>
    <button data-view="more">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      <span>More</span>
    </button>
  </div>

  <!-- TOASTS -->
  <div class="error-toast" id="error-toast"></div>
  <div class="toast" id="toast"></div>

  <!-- ONBOARDING -->
  <div class="onboarding-overlay" id="onboarding" style="display:none">
    <div class="onboarding-sheet">
      <div class="onboarding-logo">
        <svg viewBox="0 0 24 24" fill="none" width="32" height="32"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/></svg>
      </div>
      <div class="onboarding-title">Welcome to XionLive</div>
      <div class="onboarding-desc">Live scores, HD streams, and your favorite teams — all in one place.</div>
      <div class="onboarding-dots">
        <div class="onboarding-dot active" data-step="0"></div>
        <div class="onboarding-dot" data-step="1"></div>
        <div class="onboarding-dot" data-step="2"></div>
      </div>
      <button class="onboarding-btn" id="onboarding-btn">Get Started</button>
      <button class="onboarding-skip" id="onboarding-skip">Skip</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
